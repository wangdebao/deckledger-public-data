name: Refresh public card data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
permissions:
  contents: write
concurrency:
  group: public-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test
        run: node --test updater.test.cjs
      - name: Fetch public catalog and prices; reject incomplete data
        run: node publish-feed.cjs
      - name: Publish validated data atomically
        run: |
          git config user.name 'DeckLedger data updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feed/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated public card data'
          node -e "require('node:fs').writeFileSync('latest.json',JSON.stringify({sha:require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()})+'\n')"
          git add -- latest.json
          git commit -m 'Point readers to validated immutable snapshot'
          git push origin HEAD:main

